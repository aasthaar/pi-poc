<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>pi — chat</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;400;500;600&family=Syne:wght@400;600;700&display=swap" rel="stylesheet" />
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg:        #0b0c0e;
    --surface:   #111318;
    --surface-2: #13161f;
    --border:    #1e2029;
    --border-2:  #2a2d3a;
    --fg:        #cdd0dc;
    --fg-dim:    #5c6177;
    --fg-dimmer: #363845;
    --accent:    #5d8aff;
    --accent-2:  #a78bfa;
    --green:     #4ade80;
    --amber:     #fbbf24;
    --red:       #f87171;
    --cyan:      #22d3ee;
    --user-bg:   #151823;
    --agent-bg:  #0f1117;
    --radius:    6px;
    --mono:      'JetBrains Mono', monospace;
    --sans:      'Syne', sans-serif;
    --sidebar-w: 240px;
    --log-h:     200px;
  }

  html, body { height: 100%; background: var(--bg); color: var(--fg); font-family: var(--mono); font-size: 13px; line-height: 1.7; -webkit-font-smoothing: antialiased; overflow: hidden; }

  /* ── Root layout: sidebar + main ─────────────────────────────────── */
  #root {
    display: flex;
    height: 100vh;
    background: radial-gradient(circle at 50% 50%, #161923 0%, #0b0c0e 100%);
    overflow: hidden;
  }

  /* ── Session history sidebar ──────────────────────────────────────── */
  #sidebar {
    width: var(--sidebar-w);
    background: var(--surface);
    border-right: 1px solid var(--border);
    display: flex;
    flex-direction: column;
    flex-shrink: 0;
    transition: width 0.25s ease, opacity 0.25s ease;
    overflow: hidden;
  }
  #sidebar.collapsed {
    width: 0;
    opacity: 0;
    pointer-events: none;
  }

  .sidebar-header {
    padding: 14px 14px 10px;
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-shrink: 0;
  }
  .sidebar-title {
    font-family: var(--sans);
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--fg-dim);
  }
  .sidebar-new-btn {
    background: none;
    border: 1px solid var(--border-2);
    color: var(--accent);
    border-radius: 4px;
    font-size: 16px;
    line-height: 1;
    width: 22px;
    height: 22px;
    display: flex; align-items: center; justify-content: center;
    cursor: pointer;
    transition: background 0.15s;
  }
  .sidebar-new-btn:hover { background: var(--border); }

  #session-list {
    flex: 1;
    overflow-y: auto;
    padding: 6px 0;
  }
  #session-list::-webkit-scrollbar { width: 3px; }
  #session-list::-webkit-scrollbar-thumb { background: var(--border-2); border-radius: 2px; }

  .session-item {
    position: relative;
    padding: 9px 14px;
    cursor: pointer;
    border-left: 2px solid transparent;
    transition: background 0.12s, border-color 0.12s;
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 8px;
  }
  .session-item:hover { background: var(--surface-2); }
  .session-item.active {
    background: var(--surface-2);
    border-left-color: var(--accent);
  }
  .session-item-content {
    flex: 1;
    min-width: 0;
  }
  .session-item-title {
    font-size: 11.5px;
    color: var(--fg);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    line-height: 1.4;
  }
  .session-item-meta {
    font-size: 10px;
    color: var(--fg-dimmer);
    margin-top: 2px;
  }
  .session-delete-btn {
    opacity: 0;
    background: none;
    border: none;
    color: var(--fg-dimmer);
    cursor: pointer;
    font-size: 14px;
    padding: 2px 6px;
    border-radius: 3px;
    transition: opacity 0.15s, color 0.15s, background 0.15s;
    line-height: 1;
  }
  .session-item:hover .session-delete-btn {
    opacity: 1;
  }
  .session-delete-btn:hover {
    color: var(--red);
    background: rgba(248, 113, 113, 0.1);
  }

  /* ── Main column ──────────────────────────────────────────────────── */
  #main {
    flex: 0 1 860px;
    width: 100%;
    margin: 0 auto;
    display: flex;
    flex-direction: column;
    min-width: 0;
    background: var(--bg);
    border-left: 1px solid var(--border);
    border-right: 1px solid var(--border);
    position: relative;
    z-index: 2;
    box-shadow: 0 0 40px rgba(0,0,0,0.5);
  }

  /* ── Header ───────────────────────────────────────────────────────── */
  header {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 0 20px;
    height: 54px;
    border-bottom: 1px solid var(--border);
    background: rgba(17, 19, 24, 0.8);
    backdrop-filter: blur(12px);
    flex-shrink: 0;
    position: sticky;
    top: 0;
    z-index: 10;
  }

  .header-toggle {
    background: none;
    border: none;
    color: var(--fg-dim);
    cursor: pointer;
    font-size: 16px;
    padding: 2px 4px;
    border-radius: 4px;
    line-height: 1;
    transition: color 0.15s, background 0.15s;
  }
  .header-toggle:hover { color: var(--fg); background: var(--border); }

  .logo { font-family: var(--sans); font-weight: 700; font-size: 15px; letter-spacing: -0.02em; color: #fff; }
  .logo span { color: var(--accent); }

  /* ── Active skill/tool badge ──────────────────────────────────────── */
  #active-badge {
    display: none;
    align-items: center;
    gap: 7px;
    background: rgba(93, 138, 255, 0.1);
    border: 1px solid rgba(93, 138, 255, 0.3);
    border-radius: 20px;
    padding: 3px 12px 3px 9px;
    font-size: 11px;
    font-weight: 500;
    color: var(--cyan);
    animation: fadeSlide 0.2s ease;
    white-space: nowrap;
    box-shadow: 0 0 15px rgba(34, 211, 238, 0.15);
  }
  #active-badge.visible { display: flex; }
  #active-badge .badge-dot {
    width: 6px; height: 6px;
    border-radius: 50%;
    background: var(--cyan);
    animation: pulse 1s ease-in-out infinite;
    flex-shrink: 0;
  }

  .status-dot { width: 7px; height: 7px; border-radius: 50%; background: var(--fg-dimmer); transition: background 0.4s; flex-shrink: 0; }
  .status-dot.connected  { background: var(--green); box-shadow: 0 0 6px var(--green); }
  .status-dot.streaming  { background: var(--accent); box-shadow: 0 0 6px var(--accent); animation: pulse 1s ease-in-out infinite; }
  .status-dot.error      { background: var(--red); }

  @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.4; } }
  @keyframes fadeSlide { from { opacity: 0; transform: translateY(3px); } to { opacity: 1; transform: translateY(0); } }

  #status-text { font-size: 11px; color: var(--fg-dim); margin-left: auto; letter-spacing: 0.04em; white-space: nowrap; }

  /* header icon buttons */
  .hdr-btn {
    background: none;
    border: 1px solid var(--border-2);
    color: var(--fg-dim);
    border-radius: 4px;
    font-size: 11px;
    font-family: var(--mono);
    padding: 2px 8px;
    cursor: pointer;
    transition: color 0.15s, background 0.15s, border-color 0.15s;
    white-space: nowrap;
  }
  .hdr-btn:hover { color: var(--fg); border-color: var(--border-2); background: var(--border); }
  .hdr-btn.active { color: var(--accent-2); border-color: var(--accent-2); }

  /* ── Messages area ────────────────────────────────────────────────── */
  #chat-body {
    flex: 1;
    display: flex;
    flex-direction: column;
    min-height: 0;
  }

  #messages {
    flex: 1;
    overflow-y: auto;
    padding: 20px 0;
    scroll-behavior: smooth;
  }
  #messages::-webkit-scrollbar { width: 4px; }
  #messages::-webkit-scrollbar-track { background: transparent; }
  #messages::-webkit-scrollbar-thumb { background: var(--border-2); border-radius: 2px; }

  .msg { display: flex; flex-direction: column; padding: 14px 20px; border-bottom: 1px solid var(--border); animation: fadeSlide 0.18s ease; }
  .msg.user  { background: var(--user-bg); }
  .msg.agent { background: var(--agent-bg); }
  .msg.system { background: transparent; border-bottom-color: transparent; }

  .msg-meta { display: flex; align-items: center; gap: 8px; margin-bottom: 6px; }
  .msg-role { font-family: var(--sans); font-size: 11px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; }
  .msg.user  .msg-role { color: var(--accent-2); }
  .msg.agent .msg-role { color: var(--accent); }
  .msg.system .msg-role { color: var(--fg-dimmer); }
  .msg-time { font-size: 10px; color: var(--fg-dimmer); }

  /* msg-meta skill tag */
  .msg-skill-tag {
    font-size: 10px;
    color: var(--cyan);
    background: #0e1420;
    border: 1px solid #1e3060;
    border-radius: 10px;
    padding: 0px 7px;
    letter-spacing: 0.04em;
  }

  .msg-meta-right { margin-left: auto; display: flex; align-items: center; gap: 8px; }

  /* thinking toggle btn inside msg */
  .think-toggle-btn {
    background: none;
    border: 1px solid var(--border-2);
    color: var(--fg-dimmer);
    border-radius: 4px;
    font-size: 10px;
    font-family: var(--mono);
    padding: 1px 7px;
    cursor: pointer;
    transition: color 0.12s, border-color 0.12s;
  }
  .think-toggle-btn:hover { color: var(--accent-2); border-color: var(--accent-2); }
  .think-toggle-btn.has-thinking { color: var(--accent-2); border-color: #3d2a6a; background: #110d1c; }

  .msg-body { white-space: pre-wrap; word-break: break-word; color: var(--fg); }
  .msg.system .msg-body { color: var(--fg-dim); font-style: italic; }
  .msg-body code { background: #1a1d27; border: 1px solid var(--border-2); border-radius: 3px; padding: 1px 5px; font-size: 12px; }

  /* Tool badge inline */
  .tool-badge {
    display: inline-flex;
    align-items: center;
    gap: 5px;
    background: #13161f;
    border: 1px solid var(--border-2);
    border-radius: 3px;
    padding: 2px 8px;
    font-size: 11px;
    color: var(--amber);
    margin: 4px 0;
    cursor: default;
  }
  .tool-badge::before { content: "⚙"; font-size: 10px; }

  /* Thinking block */
  .thinking-block {
    border-left: 2px solid var(--fg-dimmer);
    padding: 6px 10px;
    color: var(--fg-dim);
    font-size: 12px;
    margin-bottom: 8px;
    max-height: 120px;
    overflow: hidden;
    transition: max-height 0.3s ease, opacity 0.2s ease;
  }
  .thinking-block.collapsed { max-height: 0; opacity: 0; padding-top: 0; padding-bottom: 0; margin-bottom: 0; }

  /* Streaming cursor */
  .cursor { display: inline-block; width: 7px; height: 13px; background: var(--accent); margin-left: 2px; vertical-align: text-bottom; animation: blink 0.8s step-end infinite; }
  @keyframes blink { 50% { opacity: 0; } }

  /* ── Tool Execution Log Panel ─────────────────────────────────────── */
  #log-panel {
    height: var(--log-h);
    border-top: 1px solid var(--border);
    background: #08090b;
    display: flex;
    flex-direction: column;
    flex-shrink: 0;
    transition: height 0.25s ease;
    overflow: hidden;
  }
  #log-panel.collapsed { height: 0; border-top-color: transparent; }

  .log-header {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 6px 16px;
    border-bottom: 1px solid var(--border);
    background: var(--surface);
    flex-shrink: 0;
  }
  .log-title {
    font-family: var(--sans);
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--fg-dim);
  }
  .log-count {
    background: var(--border-2);
    color: var(--fg-dim);
    border-radius: 10px;
    font-size: 10px;
    padding: 0 6px;
    min-width: 18px;
    text-align: center;
  }
  .log-clear-btn {
    margin-left: auto;
    background: none;
    border: none;
    color: var(--fg-dimmer);
    font-size: 10px;
    font-family: var(--mono);
    cursor: pointer;
    padding: 2px 6px;
    border-radius: 3px;
    transition: color 0.12s;
  }
  .log-clear-btn:hover { color: var(--red); }

  #log-entries {
    flex: 1;
    overflow-y: auto;
    padding: 6px 0;
    font-size: 11.5px;
  }
  #log-entries::-webkit-scrollbar { width: 3px; }
  #log-entries::-webkit-scrollbar-thumb { background: var(--border-2); border-radius: 2px; }

  .log-entry {
    display: grid;
    grid-template-columns: 65px 160px 1fr 70px;
    gap: 12px;
    align-items: baseline;
    padding: 6px 16px;
    border-bottom: 1px solid #0e0f12;
    animation: fadeSlide 0.15s ease;
    transition: background 0.12s;
  }
  .log-entry:hover { background: #0e0f14; }

  .log-time { color: var(--fg-dimmer); font-size: 10px; font-family: var(--mono); }
  .log-tool { color: var(--amber); font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-size: 11px; }
  .log-skill { color: var(--cyan); font-size: 10px; text-transform: uppercase; letter-spacing: 0.05em; display: block; margin-bottom: -2px; }
  .log-args { color: var(--fg-dim); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-size: 11px; }
  .log-status { font-size: 10px; white-space: nowrap; font-weight: 500; text-align: right; }
  .log-status.running { color: var(--accent); }
  .log-status.done    { color: var(--green); }
  .log-status.error   { color: var(--red); }

  .log-empty {
    padding: 20px 16px;
    color: var(--fg-dimmer);
    font-size: 11px;
    text-align: center;
    font-style: italic;
  }

  /* ── Input bar ────────────────────────────────────────────────────── */
  #input-area {
    border-top: 1px solid var(--border);
    background: var(--surface);
    padding: 12px 16px;
    display: flex;
    gap: 10px;
    align-items: flex-end;
    flex-shrink: 0;
  }

  #prompt {
    flex: 1;
    background: #0b0d14;
    border: 1px solid var(--border-2);
    border-radius: var(--radius);
    color: var(--fg);
    font-family: var(--mono);
    font-size: 13px;
    line-height: 1.6;
    padding: 9px 12px;
    resize: none;
    outline: none;
    min-height: 40px;
    max-height: 180px;
    transition: border-color 0.15s;
  }
  #prompt::placeholder { color: var(--fg-dimmer); }
  #prompt:focus { border-color: var(--accent); }

  .btn { height: 38px; padding: 0 14px; border-radius: var(--radius); border: none; cursor: pointer; font-family: var(--sans); font-size: 12px; font-weight: 600; letter-spacing: 0.04em; transition: opacity 0.15s, transform 0.1s; white-space: nowrap; }
  .btn:active { transform: scale(0.97); }
  .btn:disabled { opacity: 0.35; cursor: not-allowed; transform: none; }
  #send-btn  { background: var(--accent); color: #fff; }
  #abort-btn { background: #1e2029; color: var(--red); border: 1px solid var(--border-2); display: none; }

  .compact-notice { text-align: center; padding: 8px; font-size: 11px; color: var(--fg-dimmer); letter-spacing: 0.04em; }

  /* right-side panel (symmetrical spacer for centering) */
  #right-pad {
    width: var(--sidebar-w);
    background: transparent;
    flex-shrink: 0;
    transition: width 0.25s ease, opacity 0.25s ease;
  }

  #sidebar.collapsed ~ #right-pad {
    width: 0;
  }

  @media (max-width: 1100px) {
    #right-pad { display: none; }
    #main { margin-left: 0; margin-right: 0; flex: 1; border-right: none; }
    #sidebar:not(.collapsed) + #main { border-left: 1px solid var(--border); }
  }

  @media (max-width: 600px) {
    #sidebar { position: absolute; z-index: 100; height: 100%; box-shadow: 20px 0 50px rgba(0,0,0,0.5); }
    #main { border-left: none; }
  }
</style>
</head>
<body>
<div id="root">

  <!-- ── Session sidebar ───────────────────────────── -->
  <aside id="sidebar">
    <div class="sidebar-header">
      <span class="sidebar-title">Sessions</span>
      <button class="sidebar-new-btn" id="new-session-btn" title="New session">+</button>
    </div>
    <div id="session-list">
      <div class="log-empty">No sessions yet</div>
    </div>
  </aside>

  <!-- ── Main panel ────────────────────────────────── -->
  <div id="main">

    <header>
      <button class="header-toggle" id="sidebar-toggle" title="Toggle sessions">☰</button>
      <span class="logo">p<span>i</span></span>
      <div id="active-badge">
        <div class="badge-dot"></div>
        <span id="active-badge-text">—</span>
      </div>
      <div class="status-dot" id="dot"></div>
      <span id="status-text">connecting…</span>
      <button class="hdr-btn" id="think-global-toggle" title="Toggle all thinking blocks">💭 thinking</button>
      <button class="hdr-btn active" id="log-toggle" title="Toggle tool log">📋 log</button>
    </header>

    <div id="chat-body">
      <div id="messages"></div>

      <!-- Tool execution log -->
      <div id="log-panel">
        <div class="log-header">
          <span class="log-title">Tool Execution Log</span>
          <span class="log-count" id="log-count">0</span>
          <button class="log-clear-btn" id="log-clear">clear</button>
        </div>
        <div id="log-entries">
          <div class="log-empty" id="log-empty-msg">No tool calls yet this session</div>
        </div>
      </div>
    </div>

    <div id="input-area">
      <textarea id="prompt" rows="1" placeholder="Ask pi anything… (Enter to send, Shift+Enter for newline)"></textarea>
      <button class="btn" id="send-btn" disabled>Send</button>
      <button class="btn" id="abort-btn">Abort</button>
    </div>
  </div>

  <div id="right-pad"></div>
</div>

<script>
// ── Config ────────────────────────────────────────────────────────────────
const WS_URL = "ws://localhost:8765";

// ── State ─────────────────────────────────────────────────────────────────
let ws = null;
let streaming = false;
let currentAgentMsgEl = null;
let currentBodyEl = null;
let currentThinkingEl = null;
let currentThinkToggleBtn = null;
let currentMsgSkill = null;
let toolsActive = {};
let logCount = 0;
let activeLogEntry = null;
let thinkingGlobalVisible = true; // global toggle state
let sessions = [];   // { id, title, time, msgs }
let currentSessionId = null;

// ── DOM refs ──────────────────────────────────────────────────────────────
const messagesEl    = document.getElementById("messages");
const promptEl      = document.getElementById("prompt");
const sendBtn       = document.getElementById("send-btn");
const abortBtn      = document.getElementById("abort-btn");
const dot           = document.getElementById("dot");
const statusText    = document.getElementById("status-text");
const activeBadge   = document.getElementById("active-badge");
const activeBadgeTxt= document.getElementById("active-badge-text");
const sidebarEl     = document.getElementById("sidebar");
const sessionList   = document.getElementById("session-list");
const sidebarToggle = document.getElementById("sidebar-toggle");
const newSessionBtn = document.getElementById("new-session-btn");
const logPanel      = document.getElementById("log-panel");
const logEntries    = document.getElementById("log-entries");
const logCountEl    = document.getElementById("log-count");
const logClear      = document.getElementById("log-clear");
const logToggle     = document.getElementById("log-toggle");
const logEmptyMsg   = document.getElementById("log-empty-msg");
const thinkGlobal   = document.getElementById("think-global-toggle");

// ── Session management ────────────────────────────────────────────────────
function renderSessionList() {
  if (!sessions.length) {
    sessionList.innerHTML = '<div class="log-empty">No sessions yet</div>';
    return;
  }
  sessionList.innerHTML = sessions.map(s => `
    <div class="session-item ${s.id === currentSessionId ? 'active' : ''}" data-id="${s.id}">
      <div class="session-item-content">
        <div class="session-item-title">${escHtml(s.title)}</div>
        <div class="session-item-meta">${s.time.toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'})} · ${s.msgCount} msg${s.msgCount!==1?'s':''}</div>
      </div>
      <button class="session-delete-btn" title="Delete session">×</button>
    </div>
  `).join('');
  
  sessionList.querySelectorAll('.session-item').forEach(el => {
    const targetId = el.dataset.id;
    
    el.querySelector('.session-item-content').addEventListener('click', () => {
      if (targetId === currentSessionId) return;
      currentSessionId = targetId;
      renderSessionList();
      
      messagesEl.innerHTML = '';
      clearLog();
      
      if (ws && ws.readyState === WebSocket.OPEN) {
        ws.send(JSON.stringify({ type: "switchSession", sessionId: targetId }));
      }
    });

    el.querySelector('.session-delete-btn').addEventListener('click', (e) => {
      e.stopPropagation();
      if (confirm("Are you sure you want to delete this session?")) {
        if (ws && ws.readyState === WebSocket.OPEN) {
          ws.send(JSON.stringify({ type: "deleteSession", sessionId: targetId }));
        }
      }
    });
  });
}

function escHtml(s) {
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

newSessionBtn.addEventListener('click', () => {
  messagesEl.innerHTML = '';
  clearLog();
  currentAgentMsgEl = null;
  currentBodyEl = null;
  currentThinkingEl = null;
  addSystemMsg("Starting new session...");
  if (ws && ws.readyState === WebSocket.OPEN) {
    ws.send(JSON.stringify({ type: "newSession" }));
  }
});

// ── Sidebar toggle ────────────────────────────────────────────────────────
sidebarToggle.addEventListener('click', () => {
  sidebarEl.classList.toggle('collapsed');
});

// ── Log panel toggle ──────────────────────────────────────────────────────
logToggle.addEventListener('click', () => {
  logPanel.classList.toggle('collapsed');
  logToggle.classList.toggle('active', !logPanel.classList.contains('collapsed'));
});

logClear.addEventListener('click', clearLog);

function clearLog() {
  logEntries.innerHTML = '<div class="log-empty" id="log-empty-msg">No tool calls yet this session</div>';
  logCount = 0;
  logCountEl.textContent = '0';
}

// ── Global thinking toggle ─────────────────────────────────────────────────
thinkGlobal.addEventListener('click', () => {
  thinkingGlobalVisible = !thinkingGlobalVisible;
  thinkGlobal.classList.toggle('active', !thinkingGlobalVisible);
  thinkGlobal.textContent = thinkingGlobalVisible ? '💭 thinking' : '💭 hidden';
  document.querySelectorAll('.thinking-block').forEach(el => {
    el.classList.toggle('collapsed', !thinkingGlobalVisible);
  });
  document.querySelectorAll('.think-toggle-btn').forEach(btn => {
    btn.textContent = thinkingGlobalVisible ? '▼ thinking' : '▶ thinking';
  });
});

// ── Active skill/tool badge ───────────────────────────────────────────────
function showBadge(text) {
  activeBadgeTxt.textContent = text;
  activeBadge.classList.add('visible');
}
function hideBadge() {
  activeBadge.classList.remove('visible');
}

// ── Log helpers ───────────────────────────────────────────────────────────
function addLogEntry(toolName, args) {
  // Remove empty placeholder
  const emp = logEntries.querySelector('.log-empty');
  if (emp) emp.remove();

  logCount++;
  logCountEl.textContent = logCount;

  const entry = document.createElement('div');
  entry.className = 'log-entry';

  const now = new Date();
  const timeStr = now.toLocaleTimeString([], {hour:'2-digit', minute:'2-digit', second:'2-digit'});
  const argsStr = summarizeArgs(args);
  const skill = detectSkill(toolName, args);

  entry.innerHTML = `
    <span class="log-time">${timeStr}</span>
    <div class="log-tool-container">
      ${skill ? `<span class="log-skill">${skill}</span>` : ''}
      <span class="log-tool" title="${escHtml(toolName)}">${escHtml(toolName)}</span>
    </div>
    <span class="log-args" title="${escHtml(argsStr)}">${escHtml(argsStr)}</span>
    <span class="log-status running" data-status>running</span>
  `;

  logEntries.prepend(entry);
  activeLogEntry = entry;
  return entry;
}

function finishLogEntry(entry, success = true, updatedName = null, updatedArgs = null) {
  if (!entry) return;
  const statusEl = entry.querySelector('[data-status]');
  if (statusEl) {
    statusEl.textContent = success ? '✓ done' : '✗ error';
    statusEl.className = 'log-status ' + (success ? 'done' : 'error');
  }
  
  if (updatedName) {
    const toolEl = entry.querySelector('.log-tool');
    if (toolEl) {
      toolEl.textContent = updatedName;
      toolEl.title = updatedName;
    }
    const skill = detectSkill(updatedName, updatedArgs);
    const container = entry.querySelector('.log-tool-container');
    if (container && skill) {
      let skillEl = container.querySelector('.log-skill');
      if (!skillEl) {
        skillEl = document.createElement('span');
        skillEl.className = 'log-skill';
        container.prepend(skillEl);
      }
      skillEl.textContent = skill;
    }
  }
  
  if (updatedArgs) {
    const argsEl = entry.querySelector('.log-args');
    if (argsEl) {
      const argsStr = summarizeArgs(updatedArgs);
      argsEl.textContent = argsStr;
      argsEl.title = argsStr;
    }
  }
}

// ── WebSocket connection ──────────────────────────────────────────────────
function connect() {
  ws = new WebSocket(WS_URL);

  ws.onopen = () => {
    dot.className = "status-dot connected";
    statusText.textContent = "connected";
    sendBtn.disabled = false;
    addSystemMsg("Connected to pi agent. Type a message to start.");
  };

  ws.onclose = () => {
    dot.className = "status-dot error";
    statusText.textContent = "disconnected";
    sendBtn.disabled = true;
    abortBtn.style.display = "none";
    addSystemMsg("Disconnected. Reload to reconnect.");
    streaming = false;
    hideBadge();
  };

  ws.onerror = () => {
    dot.className = "status-dot error";
    statusText.textContent = "error — is server.mjs running?";
  };

  ws.onmessage = ({ data }) => {
    let ev;
    try { ev = JSON.parse(data); } catch { return; }
    handleEvent(ev);
  };
}

// ── Event router ──────────────────────────────────────────────────────────
function handleEvent(ev) {
  switch (ev.type) {

    case "agent_start":
      streaming = true;
      dot.className = "status-dot streaming";
      statusText.textContent = "thinking…";
      abortBtn.style.display = "inline-block";
      sendBtn.disabled = true;
      currentMsgSkill = null;

      currentAgentMsgEl = createMsgEl("agent");
      currentBodyEl = currentAgentMsgEl.querySelector(".msg-body");
      currentThinkingEl = null;
      currentThinkToggleBtn = currentAgentMsgEl.querySelector(".think-toggle-btn");
      toolsActive = {};
      activeLogEntry = null;
      break;

    case "message_update": {
      const ame = ev.assistantMessageEvent;
      if (!ame || !currentBodyEl) break;

      if (ame.type === "thinking_delta") {
        if (!currentThinkingEl) {
          currentThinkingEl = document.createElement("div");
          currentThinkingEl.className = "thinking-block" + (thinkingGlobalVisible ? "" : " collapsed");
          currentBodyEl.before(currentThinkingEl);
          // enable the toggle button now that we have thinking content
          if (currentThinkToggleBtn) {
            currentThinkToggleBtn.classList.add('has-thinking');
            currentThinkToggleBtn.textContent = thinkingGlobalVisible ? '▼ thinking' : '▶ thinking';
          }
        }
        currentThinkingEl.textContent += ame.delta;
      }

      if (ame.type === "text_delta") {
        const prev = currentBodyEl.querySelector(".cursor");
        if (prev) prev.remove();
        currentBodyEl.appendChild(document.createTextNode(ame.delta));
        const cur = document.createElement("span");
        cur.className = "cursor";
        currentBodyEl.appendChild(cur);
      }

      if (ame.type === "toolcall_start" || ame.type === "toolcall_delta") {
        const tc = ame.partial?.content?.[ame.contentIndex];
        const tid = (tc && tc.type === "toolCall") ? tc.id : null;
        const tname = (tc && tc.type === "toolCall") ? (tc.name || "tool") : "tool";

        if (ame.type === "toolcall_start") {
          const badge = document.createElement("div");
          badge.className = "tool-badge";
          badge.textContent = `${tname} …`;
          currentBodyEl.appendChild(badge);
          if (tid) toolsActive[tid] = badge;

          // Show active badge in header
          showBadge(tname);

          // Add to log
          const logEnt = addLogEntry(tname, tc?.arguments);
          if (tid) toolsActive[tid + "_log"] = logEnt;
        } else {
          // Update existing badge and log if delta provides more info
          const badge = tid ? toolsActive[tid] : null;
          if (badge && tname !== "tool") badge.textContent = `${tname} …`;
          
          const logEnt = tid ? toolsActive[tid + "_log"] : null;
          if (logEnt && tname !== "tool") {
            const toolEl = logEnt.querySelector('.log-tool');
            if (toolEl) toolEl.textContent = tname;
            const skill = detectSkill(tname, tc?.arguments);
            if (skill) {
              const container = logEnt.querySelector('.log-tool-container');
              let skillEl = container?.querySelector('.log-skill');
              if (container && !skillEl) {
                skillEl = document.createElement('span');
                skillEl.className = 'log-skill';
                container.prepend(skillEl);
              }
              if (skillEl) skillEl.textContent = skill;
            }
          }
          if (tname !== "tool") showBadge(tname);
        }
      }

      if (ame.type === "toolcall_end" && ame.toolCall) {
        const badge = toolsActive[ame.toolCall.id];
        if (badge) badge.textContent = `${ame.toolCall.name}(${summarizeArgs(ame.toolCall.arguments)})`;

        const logEnt = toolsActive[ame.toolCall.id + "_log"];
        finishLogEntry(logEnt, true, ame.toolCall.name, ame.toolCall.arguments);

        // If we detect a skill name, store it for the message tag
        currentMsgSkill = detectSkill(ame.toolCall.name, ame.toolCall.arguments);
        if (currentMsgSkill && currentAgentMsgEl) {
          const tagEl = currentAgentMsgEl.querySelector('.msg-skill-tag');
          if (tagEl) tagEl.textContent = currentMsgSkill;
        }
      }

      if (ame.type === "done" || ame.type === "error") {
        const c = currentBodyEl.querySelector(".cursor");
        if (c) c.remove();
      }

      scrollBottom();
      break;
    }

    case "agent_end":
      streaming = false;
      dot.className = "status-dot connected";
      statusText.textContent = "ready";
      abortBtn.style.display = "none";
      sendBtn.disabled = false;
      hideBadge();
      if (currentBodyEl) {
        const c = currentBodyEl.querySelector(".cursor");
        if (c) c.remove();
      }
      currentAgentMsgEl = null;
      currentBodyEl = null;
      promptEl.focus();
      break;

    case "tool_execution_start":
      statusText.textContent = `running: ${ev.toolName}`;
      showBadge(ev.toolName);
      // update log if we have an active entry for this tool
      break;

    case "tool_execution_end":
      statusText.textContent = "thinking…";
      if (activeLogEntry) finishLogEntry(activeLogEntry, true);
      hideBadge();
      break;

    case "compaction_start":
      addSystemMsg(`⟳ Compacting context (${ev.reason})…`);
      break;

    case "compaction_end":
      if (ev.result) addSystemMsg(`✓ Compacted. Summary stored.`);
      break;

    case "auto_retry_start":
      statusText.textContent = `retrying (attempt ${ev.attempt}/${ev.maxAttempts})…`;
      break;

    case "_bridge":
      if (ev.event === "agent_exited") {
        addSystemMsg(`pi process exited (code ${ev.code}).`);
      } else if (ev.event === "session_ready") {
        addSystemMsg(`Session ready · model: ${ev.model}`);
        if (ev.history) {
          messagesEl.innerHTML = '';
          clearLog();
          for (const msg of ev.history) {
            renderHistoryMessage(msg);
          }
        }
        currentSessionId = ev.sessionId;
        renderSessionList();
      } else if (ev.event === "session_list") {
        sessions = ev.sessions.map(s => ({
          id: s.id,
          title: s.title,
          time: new Date(s.created),
          msgCount: s.msgCount
        }));
        currentSessionId = ev.activeSessionId;
        renderSessionList();
      } else if (ev.event === "error") {
        addSystemMsg(`Server error: ${ev.message}`);
      }
      break;
  }
}

// ── Detect skill from tool name/args ─────────────────────────────────────
function detectSkill(toolName, args) {
  if (!toolName || toolName === "tool") return null;
  const t = toolName.toLowerCase();
  if (t.includes("email") || t.includes("gmail")) return "gmail";
  if (t.includes("calendar") || t.includes("meeting")) return "calendar";
  if (t.includes("search") || t.includes("tavily") || t.includes("web")) return "web-search";
  if (t.includes("bash") || t.includes("exec")) return "bash";
  if (t.includes("read") || t.includes("write") || t.includes("edit") || t.includes("file")) return "file";
  if (t.includes("sector") || t.includes("energy") || t.includes("battery")) return "sector-analysis";
  if (t.includes("company") || t.includes("analyst")) return "company-analyst";
  if (t.includes("thesis") || t.includes("stellar")) return "stellar-thesis";
  // fallback: only return the name if it looks like a real tool
  return (toolName.length < 20 && toolName !== "tool") ? toolName : null;
}

function renderHistoryMessage(msg) {
  const el = document.createElement("div");
  el.className = `msg ${msg.role === 'user' ? 'user' : 'agent'}`;

  const meta = document.createElement("div");
  meta.className = "msg-meta";

  const roleSpan = document.createElement("span");
  roleSpan.className = "msg-role";
  roleSpan.textContent = msg.role === "user" ? "you" : "pi";

  const metaRight = document.createElement("div");
  metaRight.className = "msg-meta-right";

  const timeSpan = document.createElement("span");
  timeSpan.className = "msg-time";
  timeSpan.textContent = new Date(msg.timestamp).toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" });
  metaRight.appendChild(timeSpan);

  if (msg.role === "assistant") {
    let skillName = null;
    if (msg.toolCalls && msg.toolCalls.length > 0) {
      skillName = detectSkill(msg.toolCalls[0].name, msg.toolCalls[0].arguments);
    }
    if (skillName) {
      const skillTag = document.createElement("span");
      skillTag.className = "msg-skill-tag";
      skillTag.textContent = skillName;
      metaRight.appendChild(skillTag);
    }

    if (msg.thinking) {
      const thinkBtn = document.createElement("button");
      thinkBtn.className = "think-toggle-btn has-thinking";
      thinkBtn.textContent = thinkingGlobalVisible ? '▼ thinking' : '▶ thinking';
      thinkBtn.addEventListener("click", () => {
        const tb = el.querySelector('.thinking-block');
        if (!tb) return;
        const isCollapsed = tb.classList.toggle('collapsed');
        thinkBtn.textContent = isCollapsed ? '▶ thinking' : '▼ thinking';
      });
      metaRight.appendChild(thinkBtn);
    }
  }

  meta.appendChild(roleSpan);
  meta.appendChild(metaRight);

  const body = document.createElement("div");
  body.className = "msg-body";

  if (msg.role === "assistant") {
    if (msg.thinking) {
      const thinkingEl = document.createElement("div");
      thinkingEl.className = "thinking-block" + (thinkingGlobalVisible ? "" : " collapsed");
      thinkingEl.textContent = msg.thinking;
      body.appendChild(thinkingEl);
    }
    
    if (msg.toolCalls) {
      for (const tc of msg.toolCalls) {
        const badge = document.createElement("div");
        badge.className = "tool-badge";
        badge.textContent = `${tc.name}(${summarizeArgs(tc.arguments)})`;
        body.appendChild(badge);
      }
    }
  }

  if (msg.content) {
    body.appendChild(document.createTextNode(msg.content));
  }

  el.appendChild(meta);
  el.appendChild(body);
  messagesEl.appendChild(el);
}

// ── DOM helpers ───────────────────────────────────────────────────────────
function createMsgEl(role) {
  const el = document.createElement("div");
  el.className = `msg ${role}`;

  const meta = document.createElement("div");
  meta.className = "msg-meta";

  const roleSpan = document.createElement("span");
  roleSpan.className = "msg-role";
  roleSpan.textContent = role === "user" ? "you" : "pi";

  const metaRight = document.createElement("div");
  metaRight.className = "msg-meta-right";

  const timeSpan = document.createElement("span");
  timeSpan.className = "msg-time";
  timeSpan.textContent = new Date().toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" });

  metaRight.appendChild(timeSpan);

  if (role === "agent") {
    const skillTag = document.createElement("span");
    skillTag.className = "msg-skill-tag";
    skillTag.style.display = "none";
    metaRight.appendChild(skillTag);

    const thinkBtn = document.createElement("button");
    thinkBtn.className = "think-toggle-btn";
    thinkBtn.textContent = "💭";
    thinkBtn.title = "No thinking content yet";
    thinkBtn.addEventListener("click", () => {
      if (!currentThinkingEl && !el.querySelector('.thinking-block')) return;
      const tb = el.querySelector('.thinking-block');
      if (!tb) return;
      const isCollapsed = tb.classList.toggle('collapsed');
      thinkBtn.textContent = isCollapsed ? '▶ thinking' : '▼ thinking';
    });
    metaRight.appendChild(thinkBtn);
    currentThinkToggleBtn = thinkBtn;
  }

  meta.appendChild(roleSpan);
  meta.appendChild(metaRight);

  const body = document.createElement("div");
  body.className = "msg-body";

  el.appendChild(meta);
  el.appendChild(body);
  messagesEl.appendChild(el);

  // Update session
  if (role === "user" || role === "agent") {
    const sess = sessions.find(s => s.id === currentSessionId);
    if (sess) { sess.msgCount++; renderSessionList(); }
  }

  scrollBottom();
  return el;
}

function addSystemMsg(text) {
  const el = document.createElement("div");
  el.className = "msg system";
  const meta = document.createElement("div");
  meta.className = "msg-meta";
  const roleSpan = document.createElement("span");
  roleSpan.className = "msg-role";
  roleSpan.textContent = "system";
  meta.appendChild(roleSpan);
  const body = document.createElement("div");
  body.className = "msg-body";
  body.textContent = text;
  el.appendChild(meta);
  el.appendChild(body);
  messagesEl.appendChild(el);
  scrollBottom();
}

function scrollBottom() {
  messagesEl.scrollTop = messagesEl.scrollHeight;
}

function summarizeArgs(args) {
  if (!args || typeof args !== "object") return "";
  const keys = Object.keys(args);
  if (keys.length === 0) return "";
  const first = keys[0];
  const val = String(args[first] ?? "");
  return val.length > 40 ? val.slice(0, 40) + "…" : val;
}

function sendPrompt() {
  const text = promptEl.value.trim();
  if (!text || !ws || ws.readyState !== WebSocket.OPEN) return;

  const msgEl = createMsgEl("user");
  msgEl.querySelector(".msg-body").textContent = text;

  const cmd = streaming
    ? { type: "prompt", message: text, streamingBehavior: "followUp" }
    : { type: "prompt", message: text };
  ws.send(JSON.stringify(cmd));

  promptEl.value = "";
  autoResize();
  promptEl.focus();
}

// ── Input events ──────────────────────────────────────────────────────────
sendBtn.addEventListener("click", sendPrompt);

abortBtn.addEventListener("click", () => {
  if (ws && ws.readyState === WebSocket.OPEN) {
    ws.send(JSON.stringify({ type: "abort" }));
  }
});

promptEl.addEventListener("keydown", (e) => {
  if (e.key === "Enter" && !e.shiftKey) {
    e.preventDefault();
    sendPrompt();
  }
});

function autoResize() {
  promptEl.style.height = "auto";
  promptEl.style.height = Math.min(promptEl.scrollHeight, 180) + "px";
}
promptEl.addEventListener("input", autoResize);

// ── Boot ──────────────────────────────────────────────────────────────────
connect();
</script>
