<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>pi — chat</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;400;500;600&family=Syne:wght@400;600;700&display=swap" rel="stylesheet" />
<style>
  /* ── Reset & tokens ───────────────────────────────────────────────── */
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg:        #0b0c0e;
    --surface:   #111318;
    --border:    #1e2029;
    --border-2:  #2a2d3a;
    --fg:        #cdd0dc;
    --fg-dim:    #5c6177;
    --fg-dimmer: #363845;
    --accent:    #5d8aff;
    --accent-2:  #a78bfa;
    --green:     #4ade80;
    --amber:     #fbbf24;
    --red:       #f87171;
    --user-bg:   #151823;
    --agent-bg:  #0f1117;
    --radius:    6px;
    --mono:      'JetBrains Mono', monospace;
    --sans:      'Syne', sans-serif;
  }

  html, body {
    height: 100%;
    background: var(--bg);
    color: var(--fg);
    font-family: var(--mono);
    font-size: 13px;
    line-height: 1.7;
    -webkit-font-smoothing: antialiased;
  }

  /* ── Layout ───────────────────────────────────────────────────────── */
  #app {
    display: grid;
    grid-template-rows: 48px 1fr auto;
    height: 100vh;
    max-width: 860px;
    margin: 0 auto;
    border-left: 1px solid var(--border);
    border-right: 1px solid var(--border);
  }

  /* ── Header ───────────────────────────────────────────────────────── */
  header {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 0 20px;
    border-bottom: 1px solid var(--border);
    background: var(--surface);
  }

  .logo {
    font-family: var(--sans);
    font-weight: 700;
    font-size: 15px;
    letter-spacing: -0.02em;
    color: #fff;
  }

  .logo span { color: var(--accent); }

  .status-dot {
    width: 7px; height: 7px;
    border-radius: 50%;
    background: var(--fg-dimmer);
    transition: background 0.4s;
    flex-shrink: 0;
  }
  .status-dot.connected  { background: var(--green); box-shadow: 0 0 6px var(--green); }
  .status-dot.streaming  { background: var(--accent); box-shadow: 0 0 6px var(--accent); animation: pulse 1s ease-in-out infinite; }
  .status-dot.error      { background: var(--red); }

  @keyframes pulse {
    0%, 100% { opacity: 1; }
    50%       { opacity: 0.4; }
  }

  #status-text {
    font-size: 11px;
    color: var(--fg-dim);
    margin-left: auto;
    letter-spacing: 0.04em;
  }

  /* ── Messages ─────────────────────────────────────────────────────── */
  #messages {
    overflow-y: auto;
    padding: 20px 0;
    scroll-behavior: smooth;
  }

  #messages::-webkit-scrollbar { width: 4px; }
  #messages::-webkit-scrollbar-track { background: transparent; }
  #messages::-webkit-scrollbar-thumb { background: var(--border-2); border-radius: 2px; }

  .msg {
    display: flex;
    flex-direction: column;
    padding: 14px 20px;
    border-bottom: 1px solid var(--border);
    animation: fadeSlide 0.18s ease;
  }
  @keyframes fadeSlide {
    from { opacity: 0; transform: translateY(4px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  .msg.user  { background: var(--user-bg); }
  .msg.agent { background: var(--agent-bg); }
  .msg.system { background: transparent; border-bottom-color: transparent; }

  .msg-meta {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-bottom: 6px;
  }

  .msg-role {
    font-family: var(--sans);
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 0.08em;
    text-transform: uppercase;
  }
  .msg.user  .msg-role { color: var(--accent-2); }
  .msg.agent .msg-role { color: var(--accent); }
  .msg.system .msg-role { color: var(--fg-dimmer); }

  .msg-time {
    font-size: 10px;
    color: var(--fg-dimmer);
    margin-left: auto;
  }

  .msg-body {
    white-space: pre-wrap;
    word-break: break-word;
    color: var(--fg);
  }
  .msg.system .msg-body { color: var(--fg-dim); font-style: italic; }

  /* Inline code */
  .msg-body code {
    background: #1a1d27;
    border: 1px solid var(--border-2);
    border-radius: 3px;
    padding: 1px 5px;
    font-size: 12px;
  }

  /* Tool call indicator */
  .tool-badge {
    display: inline-flex;
    align-items: center;
    gap: 5px;
    background: #13161f;
    border: 1px solid var(--border-2);
    border-radius: 3px;
    padding: 2px 8px;
    font-size: 11px;
    color: var(--amber);
    margin: 4px 0;
  }
  .tool-badge::before { content: "⚙"; font-size: 10px; }

  /* Thinking block */
  .thinking-block {
    border-left: 2px solid var(--fg-dimmer);
    padding: 4px 10px;
    color: var(--fg-dim);
    font-size: 12px;
    margin-bottom: 6px;
  }

  /* Streaming cursor */
  .cursor {
    display: inline-block;
    width: 7px; height: 13px;
    background: var(--accent);
    margin-left: 2px;
    vertical-align: text-bottom;
    animation: blink 0.8s step-end infinite;
  }
  @keyframes blink { 50% { opacity: 0; } }

  /* ── Input bar ────────────────────────────────────────────────────── */
  #input-area {
    border-top: 1px solid var(--border);
    background: var(--surface);
    padding: 12px 16px;
    display: flex;
    gap: 10px;
    align-items: flex-end;
  }

  #prompt {
    flex: 1;
    background: #0b0d14;
    border: 1px solid var(--border-2);
    border-radius: var(--radius);
    color: var(--fg);
    font-family: var(--mono);
    font-size: 13px;
    line-height: 1.6;
    padding: 9px 12px;
    resize: none;
    outline: none;
    min-height: 40px;
    max-height: 180px;
    transition: border-color 0.15s;
  }
  #prompt::placeholder { color: var(--fg-dimmer); }
  #prompt:focus { border-color: var(--accent); }

  .btn {
    height: 38px;
    padding: 0 14px;
    border-radius: var(--radius);
    border: none;
    cursor: pointer;
    font-family: var(--sans);
    font-size: 12px;
    font-weight: 600;
    letter-spacing: 0.04em;
    transition: opacity 0.15s, transform 0.1s;
    white-space: nowrap;
  }
  .btn:active { transform: scale(0.97); }
  .btn:disabled { opacity: 0.35; cursor: not-allowed; transform: none; }

  #send-btn {
    background: var(--accent);
    color: #fff;
  }
  #abort-btn {
    background: #1e2029;
    color: var(--red);
    border: 1px solid var(--border-2);
    display: none;
  }

  /* ── Compaction notice ────────────────────────────────────────────── */
  .compact-notice {
    text-align: center;
    padding: 8px;
    font-size: 11px;
    color: var(--fg-dimmer);
    letter-spacing: 0.04em;
  }
</style>
</head>
<body>
<div id="app">
  <header>
    <span class="logo">p<span>i</span></span>
    <div class="status-dot" id="dot"></div>
    <span id="status-text">connecting…</span>
  </header>

  <div id="messages"></div>

  <div id="input-area">
    <textarea id="prompt" rows="1" placeholder="Ask pi anything… (Enter to send, Shift+Enter for newline)"></textarea>
    <button class="btn" id="send-btn" disabled>Send</button>
    <button class="btn" id="abort-btn">Abort</button>
  </div>
</div>

<script>
// ── Config ────────────────────────────────────────────────────────────────
const WS_URL = "ws://localhost:8765";

// ── State ─────────────────────────────────────────────────────────────────
let ws = null;
let streaming = false;
let currentAgentMsgEl = null;  // the .msg.agent div being streamed into
let currentBodyEl = null;      // the .msg-body inside it
let currentThinkingEl = null;
let toolsActive = {};          // toolCallId → badge element

// ── DOM refs ──────────────────────────────────────────────────────────────
const messagesEl  = document.getElementById("messages");
const promptEl    = document.getElementById("prompt");
const sendBtn     = document.getElementById("send-btn");
const abortBtn    = document.getElementById("abort-btn");
const dot         = document.getElementById("dot");
const statusText  = document.getElementById("status-text");

// ── WebSocket connection ──────────────────────────────────────────────────
function connect() {
  ws = new WebSocket(WS_URL);

  ws.onopen = () => {
    dot.className = "status-dot connected";
    statusText.textContent = "connected";
    sendBtn.disabled = false;
    addSystemMsg("Connected to pi agent. Type a message to start.");
  };

  ws.onclose = () => {
    dot.className = "status-dot error";
    statusText.textContent = "disconnected";
    sendBtn.disabled = true;
    abortBtn.style.display = "none";
    addSystemMsg("Disconnected. Reload to reconnect.");
    streaming = false;
  };

  ws.onerror = () => {
    dot.className = "status-dot error";
    statusText.textContent = "error — is server.js running?";
  };

  ws.onmessage = ({ data }) => {
    let ev;
    try { ev = JSON.parse(data); } catch { return; }
    handleEvent(ev);
  };
}

// ── Event router ──────────────────────────────────────────────────────────
function handleEvent(ev) {
  switch (ev.type) {

    case "agent_start":
      streaming = true;
      dot.className = "status-dot streaming";
      statusText.textContent = "thinking…";
      abortBtn.style.display = "inline-block";
      sendBtn.disabled = true;
      // Start a fresh agent message block
      currentAgentMsgEl = createMsgEl("agent");
      currentBodyEl = currentAgentMsgEl.querySelector(".msg-body");
      currentThinkingEl = null;
      toolsActive = {};
      break;

    case "message_update": {
      const ame = ev.assistantMessageEvent;
      if (!ame || !currentBodyEl) break;

      if (ame.type === "thinking_delta") {
        if (!currentThinkingEl) {
          currentThinkingEl = document.createElement("div");
          currentThinkingEl.className = "thinking-block";
          currentBodyEl.before(currentThinkingEl);
        }
        currentThinkingEl.textContent += ame.delta;
      }

      if (ame.type === "text_delta") {
        // Remove cursor from previous position
        const prev = currentBodyEl.querySelector(".cursor");
        if (prev) prev.remove();
        // Append text
        currentBodyEl.appendChild(document.createTextNode(ame.delta));
        // Add cursor at end
        const cur = document.createElement("span");
        cur.className = "cursor";
        currentBodyEl.appendChild(cur);
      }

      if (ame.type === "toolcall_start") {
        const badge = document.createElement("div");
        badge.className = "tool-badge";
        badge.textContent = `${ame.partial?.name ?? "tool"} …`;
        currentBodyEl.appendChild(badge);
        if (ame.partial?.id) toolsActive[ame.partial.id] = badge;
      }

      if (ame.type === "toolcall_end" && ame.toolCall) {
        const badge = toolsActive[ame.toolCall.id];
        if (badge) badge.textContent = `${ame.toolCall.name}(${summarizeArgs(ame.toolCall.arguments)})`;
      }

      if (ame.type === "done" || ame.type === "error") {
        // Remove blinking cursor on completion
        const c = currentBodyEl.querySelector(".cursor");
        if (c) c.remove();
      }

      scrollBottom();
      break;
    }

    case "agent_end":
      streaming = false;
      dot.className = "status-dot connected";
      statusText.textContent = "ready";
      abortBtn.style.display = "none";
      sendBtn.disabled = false;
      // Remove any lingering cursor
      if (currentBodyEl) {
        const c = currentBodyEl.querySelector(".cursor");
        if (c) c.remove();
      }
      currentAgentMsgEl = null;
      currentBodyEl = null;
      promptEl.focus();
      break;

    case "tool_execution_start":
      statusText.textContent = `running: ${ev.toolName}`;
      break;

    case "tool_execution_end":
      statusText.textContent = "thinking…";
      break;

    case "compaction_start":
      addSystemMsg(`⟳ Compacting context (${ev.reason})…`);
      break;

    case "compaction_end":
      if (ev.result) addSystemMsg(`✓ Compacted. Summary stored.`);
      break;

    case "auto_retry_start":
      statusText.textContent = `retrying (attempt ${ev.attempt}/${ev.maxAttempts})…`;
      break;

    case "_bridge":
      if (ev.event === "agent_exited") {
        addSystemMsg(`pi process exited (code ${ev.code}).`);
      }
      break;
  }
}

// ── Helpers ───────────────────────────────────────────────────────────────
function createMsgEl(role) {
  const el = document.createElement("div");
  el.className = `msg ${role}`;

  const meta = document.createElement("div");
  meta.className = "msg-meta";

  const roleSpan = document.createElement("span");
  roleSpan.className = "msg-role";
  roleSpan.textContent = role === "user" ? "you" : "pi";

  const timeSpan = document.createElement("span");
  timeSpan.className = "msg-time";
  timeSpan.textContent = new Date().toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" });

  meta.appendChild(roleSpan);
  meta.appendChild(timeSpan);

  const body = document.createElement("div");
  body.className = "msg-body";

  el.appendChild(meta);
  el.appendChild(body);
  messagesEl.appendChild(el);
  scrollBottom();
  return el;
}

function addSystemMsg(text) {
  const el = document.createElement("div");
  el.className = "msg system";
  const meta = document.createElement("div");
  meta.className = "msg-meta";
  const roleSpan = document.createElement("span");
  roleSpan.className = "msg-role";
  roleSpan.textContent = "system";
  meta.appendChild(roleSpan);
  const body = document.createElement("div");
  body.className = "msg-body";
  body.textContent = text;
  el.appendChild(meta);
  el.appendChild(body);
  messagesEl.appendChild(el);
  scrollBottom();
}

function scrollBottom() {
  messagesEl.scrollTop = messagesEl.scrollHeight;
}

function summarizeArgs(args) {
  if (!args || typeof args !== "object") return "";
  const keys = Object.keys(args);
  if (keys.length === 0) return "";
  const first = keys[0];
  const val = String(args[first] ?? "");
  return val.length > 30 ? val.slice(0, 30) + "…" : val;
}

function sendPrompt() {
  const text = promptEl.value.trim();
  if (!text || !ws || ws.readyState !== WebSocket.OPEN) return;

  // Show user message
  const msgEl = createMsgEl("user");
  msgEl.querySelector(".msg-body").textContent = text;

  // Send to server
  const cmd = streaming
    ? { type: "prompt", message: text, streamingBehavior: "followUp" }
    : { type: "prompt", message: text };
  ws.send(JSON.stringify(cmd));

  promptEl.value = "";
  autoResize();
  promptEl.focus();
}

// ── Input events ──────────────────────────────────────────────────────────
sendBtn.addEventListener("click", sendPrompt);

abortBtn.addEventListener("click", () => {
  if (ws && ws.readyState === WebSocket.OPEN) {
    ws.send(JSON.stringify({ type: "abort" }));
  }
});

promptEl.addEventListener("keydown", (e) => {
  if (e.key === "Enter" && !e.shiftKey) {
    e.preventDefault();
    sendPrompt();
  }
});

function autoResize() {
  promptEl.style.height = "auto";
  promptEl.style.height = Math.min(promptEl.scrollHeight, 180) + "px";
}
promptEl.addEventListener("input", autoResize);

// ── Boot ──────────────────────────────────────────────────────────────────
connect();
</script>
</body>
</html>
